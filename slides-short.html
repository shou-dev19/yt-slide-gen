<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>mineo プラン選びショート</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&family=Noto+Sans+JP:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --blue: #0052cc;
        --blue-dark: #003380;
        --red: #e63946;
        --ink: #172033;
        --pale: #f0f5ff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #f0f4f8;
        color: var(--ink);
        font-family: "Inter", "Noto Sans JP", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
        padding: 40px;
      }
      .slide-container {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #fff;
      }
      img {
        object-fit: contain;
        filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.1));
      }
      .red {
        color: var(--red);
      }
      .slide-container.price-note::after {
        content: "※表示している料金はすべて月額・税込みの価格です";
        position: absolute;
        right: 20px;
        bottom: 16px;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.62);
        color: #fff;
        font-family: "Noto Sans JP", sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.02em;
        line-height: 1;
        padding: 10px 20px;
        border-radius: 10px;
        white-space: nowrap;
        pointer-events: none;
      }
      .slide-thumbnail {
        align-items: center;
        text-align: center;
        border: 25px solid var(--blue);
        padding: 160px 45px 300px;
        background:
          repeating-conic-gradient(
            from 0deg at 52% 48%,
            rgba(0, 82, 204, 0.06) 0deg 2.5deg,
            transparent 2.5deg 16deg
          ),
          radial-gradient(
            ellipse at 52% 48%,
            #fff 5%,
            #e8f3ff 45%,
            #c8dcff 100%
          );
      }
      .thumb-top-strip {
        position: absolute;
        top: 25px;
        left: 25px;
        right: 25px;
        z-index: 3;
        background: var(--blue);
        color: #fff;
        font-size: 36px;
        font-weight: 900;
        padding: 18px 0;
        text-align: center;
        letter-spacing: 0.06em;
      }
      .thumb-accent-tri {
        position: absolute;
        width: 0;
        height: 0;
        z-index: 1;
      }
      .thumb-accent-tri.tl {
        top: 25px;
        left: 25px;
        border-top: 300px solid rgba(0, 82, 204, 0.09);
        border-right: 300px solid transparent;
      }
      .thumb-accent-tri.br {
        bottom: 25px;
        right: 25px;
        border-bottom: 300px solid rgba(0, 82, 204, 0.09);
        border-left: 300px solid transparent;
      }
      .thumb-tag {
        z-index: 2;
        background: var(--red);
        color: #fff;
        font-size: 72px;
        font-weight: 900;
        padding: 13px 44px;
        transform: rotate(-3deg);
        box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.25);
        margin-bottom: 22px;
      }
      .thumb-title {
        z-index: 2;
        font-size: 76px;
        line-height: 1.2;
        font-weight: 900;
        max-width: 900px;
        margin-bottom: 24px;
        text-wrap: balance;
      }
      .thumb-sub-band {
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        width: 930px;
        background: var(--blue);
        color: #fff;
        font-size: 45px;
        line-height: 1.2;
        font-weight: 900;
        padding: 20px 22px;
        border-radius: 12px;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.2);
      }
      .thumb-sub-band b {
        color: #ffd700;
        font-size: 60px;
      }
      .thumb-sub-band strong {
        color: #ffd700;
      }
      .thumb-brand {
        color: #1fa33a;
        font-family: "Inter", "Noto Sans JP", sans-serif;
        font-size: 128px;
        letter-spacing: 0.01em;
        -webkit-text-stroke: 10px #fff;
        paint-order: stroke fill;
        text-shadow: 6px 6px 0 rgba(0, 0, 0, 0.18);
      }
      .thumb-illust {
        position: absolute;
        z-index: 2;
        right: 45px;
        bottom: 30px;
      }
      .cover-illust-img {
        height: 290px;
        max-width: 330px;
      }
      .slide-pad {
        padding: 72px 70px;
      }
      .watermark {
        position: absolute;
        top: -45px;
        left: 10px;
        z-index: 0;
        color: var(--blue);
        font-size: 280px;
        font-weight: 900;
        line-height: 1;
        opacity: 0.07;
      }
      .slide-title {
        position: relative;
        z-index: 1;
        font-size: 62px;
        line-height: 1.2;
        font-weight: 900;
        border-bottom: 10px solid var(--blue);
        padding-bottom: 14px;
        margin-bottom: 30px;
      }
      .slide-body {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 28px;
        margin-bottom: 120px;
      }
      .slide-illust {
        position: absolute;
        right: 40px;
        bottom: 40px;
        z-index: 2;
      }
      .illust-img {
        height: 260px;
        max-width: 290px;
      }
      .question-card {
        min-height: 500px;
        border: 8px solid var(--blue);
        background: var(--pale);
        border-radius: 28px;
        box-shadow: 8px 8px 0 #cfe1ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 35px;
      }
      .question-icon {
        width: 116px;
        height: 116px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--blue);
        color: #fff;
        font-size: 85px;
        font-weight: 900;
      }
      .question-text {
        max-width: 820px;
        font-size: 70px;
        line-height: 1.25;
        font-weight: 900;
        text-align: center;
        text-wrap: balance;
      }
      .diagnosis-hint {
        align-self: flex-start;
        font-size: 43px;
        font-weight: 900;
        color: var(--blue);
      }
      .condition-card {
        align-self: flex-start;
        background: var(--blue);
        color: #fff;
        padding: 18px 34px;
        border-radius: 18px;
        font-size: 50px;
        font-weight: 900;
      }
      .benefit-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 310px;
        background: var(--pale);
        border: 9px solid var(--blue);
        border-radius: 26px;
        box-shadow: 8px 8px 0 #cfe1ff;
        padding: 25px 26px;
      }
      .benefit-main {
        display: flex;
        align-items: baseline;
        gap: 15px;
        color: var(--red);
        font-weight: 900;
      }
      .benefit-main strong {
        font-size: 120px;
        line-height: 1.1;
      }
      .benefit-main span {
        font-size: 70px;
      }
      .benefit-unlimited {
        color: var(--blue);
        font-size: 64px;
        line-height: 1.1;
        font-weight: 900;
      }
      .benefit-usage {
        align-self: flex-start;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
        min-height: 195px;
        width: 655px;
        padding: 24px 30px;
        border-left: 14px solid var(--blue);
        border-radius: 0 20px 20px 0;
        background: var(--pale);
      }
      .benefit-usage strong {
        color: var(--blue);
        font-size: 53px;
        line-height: 1.15;
        font-weight: 900;
      }
      .usage-tags {
        display: flex;
        gap: 16px;
      }
      .usage-tags span {
        border-radius: 30px;
        padding: 8px 18px;
        background: #fff;
        color: var(--ink);
        font-size: 34px;
        font-weight: 900;
        white-space: nowrap;
      }
      .speed-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--pale);
        border-left: 14px solid var(--blue);
        border-radius: 0 20px 20px 0;
        padding: 25px 30px;
      }
      .speed-card strong {
        font-size: 145px;
        color: var(--blue);
        line-height: 1.1;
      }
      .speed-card span {
        font-size: 43px;
        font-weight: 900;
      }
      .price-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        background: #fff0f0;
        border-left: 14px solid var(--red);
        border-radius: 0 20px 20px 0;
        padding: 28px 32px;
        font-weight: 900;
      }
      .price-card span {
        font-size: 43px;
      }
      .price-card strong {
        color: var(--red);
        font-size: 67px;
        white-space: nowrap;
      }
      .switch-lead {
        background: var(--pale);
        border-left: 14px solid var(--blue);
        border-radius: 0 20px 20px 0;
        padding: 24px 32px;
        font-size: 55px;
        font-weight: 900;
      }
      .switch-frame {
        align-self: center;
        width: 690px;
        height: 410px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 8px solid var(--blue);
        border-radius: 22px;
        background: #fff;
        box-shadow: 8px 8px 0 #cfe1ff;
      }
      .switch-image {
        width: 620px;
        height: 360px;
      }
      .cta-slide {
        background: linear-gradient(135deg, #0052cc, #003380);
        color: #fff;
        align-items: center;
        justify-content: center;
      }
      .cta-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 100%;
        padding: 38px 50px 28px;
        gap: 12px;
      }
      .cta-logo {
        width: 280px;
        height: 110px;
        margin-bottom: 12px;
        background: #fff;
        border-radius: 18px;
        padding: 8px 16px;
        filter: none;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.18);
      }
      .cta-title {
        color: #ffd700;
        font-size: 84px;
        line-height: 1.15;
        font-weight: 900;
        max-width: 970px;
        text-wrap: balance;
      }
      .cta-sub {
        color: #fff;
        font-size: 50px;
        font-weight: 900;
      }
      .cta-banner-img {
        width: 900px;
        max-height: 420px;
        object-fit: contain;
        border: 8px solid #fff;
        border-radius: 14px;
        background: #fff;
      }
      .cta-arrow {
        color: #ffd700;
        font-size: 90px;
        font-weight: 900;
        line-height: 1;
        animation: bounce 1.3s ease-in-out infinite;
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(12px);
        }
      }
    </style>
  </head>
  <body>
    <!-- Slide ID: 1 -->
    <div class="slide-container slide-thumbnail" data-slide-id="1">
      <div class="thumb-top-strip">⚡ mineo プラン選び ⚡</div>
      <div class="thumb-accent-tri tl"></div>
      <div class="thumb-accent-tri br"></div>
      <div class="thumb-tag">迷ってる人へ</div>
      <h1 class="thumb-title">
        <span class="thumb-brand">mineo</span>の<br />プラン選びは3択でいい
      </h1>
      <div class="thumb-sub-band">
        <span>コースは5つ</span><b>→</b><strong>選ぶのは3つだけ</strong>
      </div>
      <div class="thumb-illust">
        <img
          class="cover-illust-img"
          src="public/images/irasutoya/pose_yubisashi_kakunin_businesswoman.png"
          alt="案内する人物"
        />
      </div>
    </div>
    <!-- Slide ID: 2 -->
    <div class="slide-container slide-pad diagnosis" data-slide-id="2">
      <div class="watermark">2</div>
      <h2 class="slide-title">診断</h2>
      <div class="slide-body">
        <div class="question-card">
          <div class="question-icon">？</div>
          <div class="question-text">
            外で高画質の動画やゲームを毎日使う<span class="red">？</span>
          </div>
        </div>
        <div class="diagnosis-hint">使い方でコースを絞る</div>
      </div>
      <div class="slide-illust" style="z-index: 2">
        <img
          class="illust-img"
          src="public/images/irasutoya/businessman2_kangaechu.png"
          alt="スライド内容のイラスト"
        />
      </div>
    </div>
    <!-- Slide ID: 3 -->
    <div class="slide-container slide-pad benefit" data-slide-id="3">
      <div class="watermark">3</div>
      <h2 class="slide-title">3GB＋パケット放題</h2>
      <div class="slide-body">
        <div class="condition-card">LINE・音楽中心なら</div>
        <div class="benefit-card">
          <div class="benefit-main">
            <strong>1Mbps</strong><span>が無料</span>
          </div>
          <div class="benefit-unlimited">使い放題</div>
        </div>
        <div class="benefit-usage">
          <strong>日常利用に十分！</strong>
          <div class="usage-tags"><span>💬 LINE</span><span>🎵 音楽</span></div>
        </div>
      </div>
      <div class="slide-illust" style="z-index: 2">
        <img
          class="illust-img"
          src="public/images/irasutoya/sns_happy_woman.png"
          alt="スライド内容のイラスト"
        />
      </div>
    </div>
    <!-- Slide ID: 4 -->
    <div class="slide-container slide-pad price-note price" data-slide-id="4">
      <div class="watermark">4</div>
      <h2 class="slide-title">動画も見るなら</h2>
      <div class="slide-body">
        <div class="speed-card">
          <strong>3Mbps</strong><span>SNSの動画も楽しめる</span>
        </div>
        <div class="price-card">
          <span>アップグレード</span><strong>月385円</strong>
        </div>
      </div>
      <div class="slide-illust" style="z-index: 2; margin-bottom: 30px">
        <img
          class="illust-img"
          src="public/images/irasutoya/pose_necchuu_smartphone_woman.png"
          alt="スライド内容のイラスト"
        />
      </div>
    </div>
    <!-- Slide ID: 5 -->
    <div class="slide-container slide-pad switch" data-slide-id="5">
      <div class="watermark">5</div>
      <h2 class="slide-title">mineoスイッチでいつでも切替</h2>
      <div class="slide-body">
        <div class="switch-lead">月末もギガの心配なし</div>
        <div class="switch-frame">
          <img
            class="switch-image"
            src="public/images/temp/mineo/mineoスイッチ_切り出し.png"
            alt="mineoスイッチの画面"
          />
        </div>
      </div>
      <div class="slide-illust" style="z-index: 2">
        <img
          class="illust-img"
          src="public/images/irasutoya/pose_anshin_woman.png"
          alt="スライド内容のイラスト"
        />
      </div>
    </div>
    <!-- Slide ID: 6 -->
    <div class="slide-container cta-slide" data-slide-id="6">
      <div class="cta-content">
        <img
          class="cta-logo"
          src="public/images/logo/Mineo_logo.png"
          alt="mineo ロゴ"
        />
        <h2 class="cta-title">15GB・30GB以上の選び方</h2>
        <div class="cta-sub">続きは本編で詳しく解説</div>
        <img
          class="cta-banner-img"
          src="public/images/thumbnails/48_【決定版】mineoのプラン選びは3択でいい。歴8年が教える実質使い放題の選び方_サムネ1.png"
          alt="mineo の本編動画サムネイル"
        />
        <div class="cta-arrow">▼</div>
      </div>
    </div>
  </body>
</html>
